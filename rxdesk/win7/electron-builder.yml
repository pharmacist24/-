# Windows 7 installer (Electron 22, 64-bit + 32-bit in one file). Same app id and data folder as the
# main installer, so a PC can later move to the Windows 10/11 installer and keep its data.
appId: com.rxdesk.app
productName: RxDesk
copyright: Copyright © 2026 RxDesk
directories:
  output: dist
  buildResources: ../build
files:
  - out/**
  - from: ../resources
    to: resources
  - package.json
  - "!scripts/**"
asar: true
asarUnpack:
  - "**/*.node"
# The SQLite module comes from its official prebuilds (win7-sqlite-prebuild.cjs + after-pack), never compiled.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64, ia32]
  icon: ../build/icon.ico
  executableName: RxDesk
  legalTrademarks: RxDesk
  # No code-signing certificate (would be a paid service). Windows SmartScreen may show
  # "Windows protected your PC" the first time: click "More info" > "Run anyway".
  signAndEditExecutable: true
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: RxDesk
  runAfterFinish: true
  # Patient data lives in %APPDATA%\RxDesk and must survive uninstall / reinstall.
  deleteAppDataOnUninstall: false
  installerIcon: ../build/icon.ico
  uninstallerIcon: ../build/icon.ico
  uninstallDisplayName: RxDesk
  artifactName: RxDesk-Setup-Win7-${version}.exe
publish: null
afterPack: ../scripts/after-pack.cjs
