# Builds the RxDesk Windows installers and publishes them as downloadable files on a GitHub Release.
# Download page: https://github.com/pharmacist24/-/releases/tag/rxdesk-v1.0.0
name: RxDesk installers

on:
  push:
    branches: [claude/confident-babbage-4tsn1c]
    paths: ['rxdesk/**', '.github/workflows/rxdesk-installers.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rxdesk-installers
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Windows 10 / 11 installer
        working-directory: rxdesk
        run: |
          npm ci
          npm run dist

      - name: Windows 7 / 8 installer (32 + 64-bit)
        working-directory: rxdesk/win7
        # better-sqlite3 9.6 has no prebuild for the build machine's Node 22, so its install script would try to
        # compile it; skip scripts and download the official Electron 22 prebuilds instead.
        run: |
          npm ci --ignore-scripts
          node ../scripts/win7-sqlite-prebuild.cjs
          npm run dist

      # Install and start each installer on this real Windows machine before publishing it.
      - name: Smoke test – Windows 10 / 11 installer
        id: smoke10
        continue-on-error: true
        working-directory: rxdesk
        run: node scripts/smoke-windows.mjs dist/RxDesk-Setup-1.0.0.exe win10

      - name: Smoke test – Windows 7 / 8 installer
        id: smoke7
        continue-on-error: true
        working-directory: rxdesk
        run: node scripts/smoke-windows.mjs win7/dist/RxDesk-Setup-Win7-1.0.0.exe win7

      - name: Keep smoke-test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: rxdesk/smoke-output

      - name: Stop if a smoke test failed
        if: steps.smoke10.outcome != 'success' || steps.smoke7.outcome != 'success'
        run: |
          echo "Smoke test failed: win10=${{ steps.smoke10.outcome }} win7=${{ steps.smoke7.outcome }}"
          exit 1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rxdesk-v1.0.0
          target_commitish: ${{ github.sha }}
          name: RxDesk 1.0.0 – Windows installers
          make_latest: true
          body: |
            **Which file do I download?**

            | Your PC | File |
            |---|---|
            | Windows 10 or 11 | **RxDesk-Setup-1.0.0.exe** |
            | Windows 7 or 8 (32-bit or 64-bit) | **RxDesk-Setup-Win7-1.0.0.exe** |

            Double-click the file to install. If Windows shows "Windows protected your PC", click
            **More info → Run anyway** (the app is not signed with a paid certificate).

            Admin web app: https://rxdesk-admin.onrender.com
          files: |
            rxdesk/dist/RxDesk-Setup-1.0.0.exe
            rxdesk/win7/dist/RxDesk-Setup-Win7-1.0.0.exe
          fail_on_unmatched_files: true
